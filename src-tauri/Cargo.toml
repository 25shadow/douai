[package]
name = "douai"
version = "1.0.0"
description = "DouAi live interaction workbench"
authors = ["DouAi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
